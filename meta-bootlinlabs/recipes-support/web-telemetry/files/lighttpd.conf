server.modules += (
    "mod_access",
    "mod_cgi"
)

server.document-root        = "/www/pages"
server.port                 = 80
server.username             = "daemon"
server.groupname            = "daemon"
server.indexfiles           = ( "index.html" )

# Enable CGI execution
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = (
        ".cgi" => "/bin/sh",
        ".sh"  => "/bin/sh"
    )
}
